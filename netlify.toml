[build]
  # Directory to publish (where your index.html is located)
  publish = "."
  
  # Command to run before build (if needed)
  # command = "echo 'No build process needed for static site'"

[build.environment]
  # Environment variables (if needed)
  NODE_VERSION = "18"

# Redirect rules for single page application
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Headers for better security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Form handling (for contact form)
[forms]
  # Forms submission endpoint
  # Your contact form will automatically work with Netlify Forms
  
# Functions directory (if you add serverless functions later)
[functions]
  directory = "functions"